server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: sales-subscription
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:park_sales}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:park-sales-subscription-secret-key-change-me-in-prod-please}
    expire-minutes: 720
  approval:
    # internal | oa  审批网关：内置审批流 或 对接外部 OA
    gateway: ${APPROVAL_GATEWAY:internal}
    # 内置审批链（按角色顺序）
    chain: SALES_MANAGER,FINANCE,LEGAL
